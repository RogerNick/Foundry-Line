<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Foundry Line: build a factory, automate everything, and launch a rocket.">
<meta name="theme-color" content="#0b0d0c">
<title>Foundry Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed canvas world, instrument-panel HUD pinned to the edges like a control room */
:root{
  --bg:#0b0d0c; --ink:#ece6d6; --dim:#8f978d; --panel:rgba(20,24,22,.92); --panel2:#222925; --line:#343d37;
  --amber:#f2a93b; --amber-ink:#1b1306; --good:#6cd17a; --bad:#ef5b4c; --blue:#5aa9f0; --warn:#e6b84a;
  --disp:'Saira Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#cv.tool{cursor:cell}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{font:800 22px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;color:var(--ink);display:flex;align-items:center}
.brand span{color:var(--amber)}
.meter{padding:7px 11px;min-width:200px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lab{display:flex;justify-content:space-between;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.lab b{font:500 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden}
.bar.thin{height:3px}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.menu{display:flex;gap:6px;padding:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:600 13px/1 var(--body);padding:8px 11px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible,.slot:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{border-color:#ef5b4c88;color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.btn.sm{padding:5px 8px;font-size:12px}
kbd{font:500 10px var(--mono);border:1px solid #fff3;border-bottom-width:2px;border-radius:3px;padding:1px 4px;color:var(--dim)}
.btn.pri kbd{color:var(--amber-ink);border-color:#0004}
#obj{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:var(--topH,66px);width:280px;padding:10px 12px;z-index:4}
.h{font:700 13px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h small{font:500 11px var(--mono);color:var(--dim);letter-spacing:0}
#obj ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
#obj li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3}
#obj li::before{content:"";flex:none;width:9px;height:9px;margin-top:4px;border:1.5px solid var(--dim);border-radius:2px}
#obj li.first{color:var(--ink)}#obj li.first::before{border-color:var(--amber);background:#f2a93b33}
#obj li:not(.first){color:var(--dim)}
#hotbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 182px);margin-inline:auto;width:fit-content;max-width:calc(100% - 206px);box-sizing:border-box;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:3px;padding:5px;z-index:5;overflow-x:auto;align-items:center}
.grp{display:flex;gap:3px;padding-right:5px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0;margin-right:0;padding-right:0}
.slot{position:relative;width:42px;height:42px;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:5px;cursor:pointer;padding:0;display:grid;place-items:center}
.slot canvas{width:30px;height:30px}
.slot .k{position:absolute;left:3px;top:1px;font:500 9px var(--mono);color:var(--dim)}
.slot .lock{position:absolute;inset:0;display:none;place-items:center;background:#0b0d0cd8;border-radius:5px}
.slot .lock::after{content:"";width:9px;height:7px;border:1.5px solid #8f978d;border-radius:1px;box-shadow:0 -4px 0 -1px #0b0d0c,0 -5px 0 0 #8f978d}
.slot.locked .lock{display:grid}
.slot.poor::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.slot.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber),0 0 14px #f2a93b44}
.slot:hover{border-color:#f2a93b99}
#tip{position:fixed;z-index:20;pointer-events:none;width:260px;padding:10px 12px;font-size:13px}
#tip .t{font:700 17px/1.1 var(--disp);letter-spacing:.03em;margin-bottom:4px}
#tip p{margin:4px 0 8px;color:var(--dim);line-height:1.35}
.costs{display:flex;flex-wrap:wrap;gap:4px}
.cost{display:inline-flex;align-items:center;gap:3px;font:500 12px var(--mono);background:#0005;border-radius:4px;padding:2px 5px 2px 3px;font-variant-numeric:tabular-nums}
.cost img{width:16px;height:16px}
.cost.no{color:var(--bad)}
.cost.ok{color:var(--ink)}
#modebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:5;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
#modebar .m{font:700 15px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
#modebar .d{color:var(--dim);font-size:13px}
#mini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:170px;height:170px;z-index:4;border:1px solid var(--line);border-radius:6px;background:#000;cursor:pointer;image-rendering:pixelated}
#hover{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 72px);font:500 12px var(--mono);color:var(--dim);z-index:4;padding:6px 9px;max-width:300px}
.drawer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:var(--topH,66px);width:340px;max-height:calc(100% - 180px);overflow:auto;padding:12px;z-index:6}
#inspector{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:var(--topH,66px);width:310px;max-height:calc(100% - 270px);overflow:auto;padding:12px;z-index:6}
.ititle{font:700 22px/1 var(--disp);letter-spacing:.02em;margin:6px 0 4px}
.stat{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:3px;background:#0005}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--good)}.s-idle{color:var(--warn)}.s-block{color:var(--bad)}.s-nopower{color:var(--blue)}.s-norecipe{color:var(--dim)}
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sec>.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:7px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0;align-items:center}
.kv b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.kv img{vertical-align:-3px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.pick button{aspect-ratio:1;max-width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:3px;display:grid;place-items:center}
.pick button img{width:24px;height:24px}
.pick button.on{border-color:var(--amber);background:#f2a93b22}
.pick button:hover{border-color:#f2a93baa}
.slots{display:flex;gap:5px;flex-wrap:wrap}
.mslot{width:40px;height:40px;border:1px dashed #8f978d88;border-radius:5px;display:grid;place-items:center;background:#0004;cursor:pointer;padding:0}
.mslot.full{border-style:solid;border-color:var(--line);background:var(--panel2)}
.mslot img{width:28px;height:28px}
.recipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:500 12px var(--mono)}
.recipe .arrow{color:var(--dim)}
.pbar{height:5px;background:#0007;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--amber)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.it img{width:28px;height:28px}
.it b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.it span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.craft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st td{padding:4px 3px;border-bottom:1px solid #ffffff0d;vertical-align:middle}
table.st td.n{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.st th{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);text-align:right;padding:0 3px 6px}
table.st th:first-child{text-align:left}
table.st img{width:20px;height:20px;vertical-align:middle;margin-right:5px}
.bp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:7px}
.bp.on{border-color:var(--amber)}
.bp .top{display:flex;gap:9px;align-items:center}
.bp .top img{width:72px;height:54px;flex:none;background:#0b0d0c;border-radius:4px;image-rendering:pixelated}
.bp .nm{font:700 16px/1.1 var(--disp);letter-spacing:.02em;word-break:break-word}
.bp .meta{font:500 11px var(--mono);color:var(--dim)}
.bp input,.ta{width:100%;background:#0b0d0c;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 7px;font:500 13px var(--body);box-sizing:border-box}
.ta{font:500 11px var(--mono);height:70px;resize:vertical}
.bplist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#modal{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:16px}
.sheet{width:min(1240px,100%);max-height:88vh;overflow:auto;padding:18px 20px}
.sheet h2{font:800 30px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0}
.sheet .sub{color:var(--dim);margin:6px 0 14px;max-width:70ch}
.tree{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.tier{display:flex;flex-direction:column;gap:8px;flex:none;width:224px}
.tier>.lbl{font:600 11px var(--mono);color:var(--dim);letter-spacing:.06em}
.tech{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px}
.tech .nm{font:700 17px/1.05 var(--disp);letter-spacing:.02em;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tech .nm small{font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tech p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.35}
.tech.done{opacity:.5}.tech.done .nm small{color:var(--good)}
.tech.locked{opacity:.42}
.tech.ready .nm small{color:var(--ink)}
.tech.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.tech.active .nm small{color:var(--amber)}
.tech .req{font-size:11px;color:var(--dim)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn.on{border-color:var(--amber);color:var(--amber)}
.spd{display:flex;gap:3px;padding:6px;align-items:center}
.spd .btn{padding:6px 8px;font:600 12px var(--mono)}
.spd .btn.on{border-color:var(--amber);color:var(--amber);background:#f2a93b18}
.alerts{display:flex;flex-direction:column;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.al{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600}
.al::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.al.bad{color:var(--bad)}.al.warn{color:var(--warn)}.al.blue{color:var(--blue)}
.qtag{font:600 10px var(--mono);color:var(--blue)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.cols h3{font:700 15px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.cols dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.cols dt{font:500 12px var(--mono);color:var(--ink);white-space:nowrap}
.cols dd{margin:0;color:var(--dim)}
.cols p{color:var(--dim);font-size:13px;margin:0 0 8px;line-height:1.45}
#toasts{position:fixed;top:var(--topH,70px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:25;pointer-events:none}
.toast{padding:8px 14px;font-weight:600;animation:tin .25s ease-out;text-align:center}
.toast.big{font:700 20px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;border-color:var(--amber);color:var(--amber);padding:12px 18px}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i{transition:none}}
@media (max-width:900px){#obj{display:none}.meter{min-width:150px}.menu{margin-left:0}#hotbar{right:max(12px,env(safe-area-inset-right,0px));max-width:calc(100% - 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}}

/* ---- website shell: account gate and save slots ---- */
html,body{margin:0}
[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px 16px;overflow:auto;
  background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 32px),radial-gradient(ellipse at 50% 25%,#232b24 0%,#0b0d0c 72%)}
.gbox{width:min(440px,100%);padding:24px;box-sizing:border-box}
.gbox.wide{width:min(840px,100%)}
.glogo{font:800 52px/.9 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:0}
.glogo span{color:var(--amber)}
.gsub{color:var(--dim);margin:10px 0 4px;max-width:52ch;line-height:1.45}
.gtabs{display:flex;gap:4px;margin:18px 0 4px}
.gtabs .btn{flex:1;justify-content:center}
.gtabs .btn.on{border-color:var(--amber);color:var(--amber);background:#f2a93b14}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.field input{background:#0b0d0c;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:10px 11px;font:500 15px var(--body);box-sizing:border-box;width:100%}
.field input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.field small{color:var(--dim);font-size:12px}
.gerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.gbtn{width:100%;justify-content:center;padding:11px;font-size:15px;margin-top:6px}
.gor{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:14px 0 10px;text-transform:uppercase;letter-spacing:.1em}
.gor::before,.gor::after{content:"";flex:1;height:1px;background:var(--line)}
.ghead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.gwho{font:500 12px var(--mono);color:var(--dim)}
.slots3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}
.scard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:170px;min-width:0}
.scard.empty{border-style:dashed;background:transparent}
.scard .sn{font:700 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.scard .st2{font:700 22px/1.05 var(--disp);letter-spacing:.02em}
.scard .sm2{font:500 12px var(--mono);color:var(--dim);line-height:1.5}
.scard .row{margin-top:auto}
.gnote{color:var(--dim);font-size:12.5px;margin:14px 0 0;line-height:1.45}

</style>

</head>
<body>
<div id="gate" hidden><div class="gbox panel" id="gbox"></div></div>
<canvas id="cv"></canvas>
<div id="top">
  <div class="panel brand">Foundry<span>Line</span></div>
  <div class="panel meter"><div class="lab"><span>Power grid</span><b id="pwTxt">–</b></div><div class="bar"><i id="pwBar"></i></div><div class="bar thin" id="accWrap" hidden><i id="accBar" style="background:var(--blue)"></i></div></div>
  <div class="panel meter" style="min-width:150px"><div class="lab"><span id="skyName">Day 1</span><b id="skyTxt">06:00</b></div><div class="bar thin"><i id="skyBar" style="background:var(--warn)"></i></div></div>
  <div class="panel meter"><div class="lab"><span id="rsName">Research</span><b id="rsTxt">None active</b></div><div class="bar"><i id="rsBar" style="background:var(--amber)"></i></div></div>
  <div class="panel spd" id="spd" title="Game speed (, and .)">
    <button class="btn" data-act="speed" data-n="0" aria-label="Pause">II</button>
    <button class="btn on" data-act="speed" data-n="1">1×</button>
    <button class="btn" data-act="speed" data-n="2">2×</button>
    <button class="btn" data-act="speed" data-n="4">4×</button>
  </div>
  <div class="panel menu">
    <button class="btn" data-act="inv">Inventory <kbd>I</kbd></button>
    <button class="btn" data-act="tech">Research <kbd>T</kbd></button>
    <button class="btn" data-act="stats">Production <kbd>P</kbd></button>
    <button class="btn" data-act="lib">Blueprints <kbd>B</kbd></button>
    <button class="btn" data-act="acct" id="acctBtn">Account</button>
    <button class="btn" data-act="help">Help <kbd>H</kbd></button>
  </div>
</div>
<div id="obj" class="panel"></div>
<div id="modebar" class="panel" hidden></div>
<div id="hotbar" class="panel"></div>
<div id="tip" class="panel" hidden></div>
<canvas id="mini" width="240" height="240"></canvas>
<div id="hover" class="panel" hidden></div>
<aside id="inspector" class="panel" hidden></aside>
<aside id="invPanel" class="panel drawer" hidden></aside>
<aside id="statsPanel" class="panel drawer" hidden></aside>
<aside id="libPanel" class="panel drawer" hidden></aside>
<div id="modal" hidden><div class="sheet panel" id="sheet"></div></div>
<div id="toasts"></div>

<script>
'use strict';
// ================== CONSTANTS & DATA ==================
const T=32, W=240, H=240, HX=120, HY=120, GAP=0.25, CH=16, DAY=600;
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const SAVE_KEY='foundryline_save_v2', BP_KEY='foundryline_blueprints_v1';

const ITEMS={
  iron_ore:{name:'Iron Ore',color:'#8fa3b8',shape:'ore'},
  copper_ore:{name:'Copper Ore',color:'#d47a45',shape:'ore'},
  coal:{name:'Coal',color:'#26262b',shape:'ore',edge:'#6a6a74'},
  stone:{name:'Stone',color:'#b3a386',shape:'ore'},
  quartz:{name:'Quartz',color:'#ddd6ff',shape:'crystal'},
  crude_oil:{name:'Crude Oil',color:'#2a2420',shape:'barrel'},
  uranium_ore:{name:'Uranium Ore',color:'#5fd35a',shape:'ore',edge:'#1f4d1d'},
  iron_plate:{name:'Iron Plate',color:'#bccad8',shape:'plate'},
  copper_plate:{name:'Copper Plate',color:'#e8935a',shape:'plate'},
  brick:{name:'Brick',color:'#b5563a',shape:'brick'},

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=(x*374761393+y*668265263+seed*69069)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const s=v=>v*v*(3-2*v);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);const u=s(xf),v=s(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

function shade(h,a){const[r,g,b]=hexRgb(h);const t=a<0?0:255,p=Math.abs(a);return`rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`}
function mix(h1,h2,t){const a=hexRgb(h1),b=hexRgb(h2);return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`}

    const o={t:e.type,dx:x-x0,dy:y-y0,d:e.dir};if(e.recipe)o.r=e.recipe;if(e.filter)o.f=e.filter;if(e.mods&&e.mods.length)o.m=[...e.mods];list.push(o)}

      :s==='locked'?`<div class="row" style="margin-top:0"><button class="btn sm" data-act="queue" data-r="${t.id}">Queue with prerequisites</button></div>`:''}

  <div class="cols">

   <div><h3>Move & panels</h3><dl><dt>WASD</dt><dd>Pan the map. Drag empty ground too</dd><dt>Space + drag</dt><dd>Pan while building</dd><dt>Scroll</dt><dd>Zoom</dd><dt>Click building</dt><dd>Recipe, modules, fuel, upgrade</dd><dt>T / I / P</dt><dd>Research, inventory, production</dd><dt>, and .</dt><dd>Slow down or speed up: pause, 1×, 2×, 4×</dd><dt>M</dt><dd>Sound on or off</dd></dl></div>
   <div><h3>Logistics</h3><p>Belt Tunnels come in pairs: place one, then another facing the same way up to 6 tiles ahead. Items travel under anything in between, so belts can cross.</p><p>A Supply Depot pulls a chosen item out of your inventory onto a belt. Use it to feed distant builds or top up generators from stock.</p><p>In the research tree you can queue locked tech. Its prerequisites queue up for you.</p></div>
   <div><h3>Power</h3><p>Every machine shares one grid. If demand outruns supply, everything slows together.</p><p>Coal generators burn only what's needed. Wind drifts. Solar follows a ten-minute day and dies at night, so pair it with Accumulators. Nuclear reactors are huge but need fuel rods.</p><p>Status lights: green working, yellow waiting, red blocked, blue no power.</p></div>
  </div>
  ${saveIO==='out'?`<div class="sec"><div class="lbl">Save text</div><textarea class="ta" id="saveOut" readonly style="height:90px">FLS2:${btoa(unescape(encodeURIComponent(serialize())))}</textarea><div class="row"><button class="btn pri sm" data-act="savecopy">Copy</button><button class="btn sm" data-act="saveclose">Done</button></div></div>`:''}

  <div class="sec" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="color:var(--dim);font-size:13px">Your factory saves in this browser every 20 seconds. Export a copy to keep it safe or move it to another computer.</span><button class="btn" data-act="saveout">Export save</button><button class="btn" data-act="savein">Import save</button>${resetArm?`<button class="btn danger" data-act="resetYes">Erase factory and start over</button><button class="btn" data-act="resetNo">Keep it</button>`:`<button class="btn" data-act="reset">New world</button>`}</div>`}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,r=b.dataset.r,i=+b.dataset.i;
  switch(a){
    case'inv':toggleDrawer(invEl);break;case'stats':toggleDrawer(statsEl);break;case'lib':toggleDrawer(libEl);break;case'tech':openTech();break;case'help':openHelp();break;
    case'close':closeInspector();break;case'closem':closeModal();break;
    case'hc':handCraft(r,+b.dataset.n);break;
    case'recipe':if(inspected){setRecipe(inspected,r);renderInspector()}break;
    case'filter':if(inspected){inspected.filter=inspected.filter===r?null:r;blip(600,0.05,'triangle');renderInspector()}break;
    case'fuel':if(inspected){feed(inspected);renderInspector()}break;
    case'take':if(inspected){inspected.buf.forEach(addInv);inspected.buf=[];renderInspector()}break;
    case'rot':if(inspected){inspected.dir=(inspected.dir+1)%4;if(inspected.type==='tunnel')retunnel();blip(520,0.03)}break;
    case'copy':if(inspected)pipette(inspected);break;
    case'del':if(inspected)removeAt(inspected.x,inspected.y);break;
    case'upg':if(inspected){const res=upgradeEnt(inspected);if(res==='ok'){blip(880,0.1,'triangle',0.04);toast(`Upgraded to ${BUILD[inspected.type].name}`)}renderInspector()}break;
    case'modin':if(inspected&&(inv[r]||0)>0&&inspected.mods.length<BUILD[inspected.type].slots){inv[r]--;inspected.mods.push(r);calcMods(inspected);blip(700,0.06,'triangle');renderInspector()}break;
    case'modout':if(inspected){const m=inspected.mods.splice(i,1)[0];if(m)addInv(m);calcMods(inspected);blip(400,0.05,'triangle');renderInspector()}break;
    case'research':startResearch(r);renderTech();break;
    case'cancelr':if(active){refund(paid);paid={};active=null;renderTech()}break;
    case'queue':queueTech(r);renderTech();break;
    case'unqueue':rq=rq.filter(q=>q!==r);renderTech();break;
    case'clearq':rq=[];renderTech();break;
    case'speed':setSpeed(+b.dataset.n);break;
    case'saveout':saveIO='out';sheetEl.innerHTML=helpHTML();{const ta=$('saveOut');if(ta)ta.select()}break;
    case'savein':saveIO='in';sheetEl.innerHTML=helpHTML();{const ta=$('saveIn');if(ta)ta.focus()}break;
    case'saveclose':saveIO=null;sheetEl.innerHTML=helpHTML();break;
    case'savecopy':{const ta=$('saveOut');if(!ta)break;if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('Save copied'),()=>{ta.select();toast('Press Ctrl+C to copy')});else{ta.select();toast('Press Ctrl+C to copy')}break}
    case'saveload':{const ta=$('saveIn');let ok=false;try{const v=ta.value.trim();if(v.startsWith('FLS2:'))ok=load(decodeURIComponent(escape(atob(v.slice(5)))))}catch(e){ok=false}
      if(ok){saveIO=null;closeAll();clearModes();save();refreshHotbar(true);toast('Factory loaded',true)}else toast('That text is not a valid save.');break}
    case'reset':resetArm=true;sheetEl.innerHTML=helpHTML();break;
    case'resetNo':resetArm=false;sheetEl.innerHTML=helpHTML();break;
    case'resetYes':try{localStorage.removeItem(SAVE_KEY)}catch(e){}newGame();closeAll();clearModes();objDone=0;refreshHotbar(true);toast('New world generated',true);break;
    case'tcopy':setTool('copy');break;
    case'bpuse':setBP(i);renderLib();break;
    case'bpren':bpRename=i;bpDelArm=-1;renderLib();break;
    case'bpren2':finishRename();break;
    case'bpexp':bpExportIdx=i;renderLib();{const ta=$('bpOut');if(ta)ta.select()}break;
    case'bpexpclose':bpExportIdx=-1;renderLib();break;
    case'bpcopy':{const ta=$('bpOut');if(!ta)break;navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>toast('Blueprint text copied'),()=>{ta.select();toast('Press Ctrl+C to copy')});if(!navigator.clipboard){ta.select();toast('Press Ctrl+C to copy')}break}
    case'bpdel':bpDelArm=i;renderLib();break;
    case'bpdel2':blueprints.splice(i,1);saveBP();if(bpSel===i)clearModes();else if(bpSel!==null&&bpSel>i)bpSel--;bpDelArm=-1;renderLib();break;
    case'bpimp':bpImportOpen=true;renderLib();{const ta=$('bpIn');if(ta)ta.focus()}break;
    case'bpimpclose':bpImportOpen=false;renderLib();break;
    case'bpimp2':{const ta=$('bpIn');if(ta&&bpImport(ta.value)){bpImportOpen=false;toast('Blueprint imported');renderLib()}else toast('That text is not a valid blueprint.');break}
  }
});

function serialize(){
  return JSON.stringify({v:2,seed,inv,techs:[...techs],techLv,active,paid,delivered,made,playTime,genAuto,won,cam:{x:cam.x,y:cam.y,z:zoom},
    ents:ents.filter(e=>e.type!=='hub').map(e=>{const o={t:e.type,x:e.x,y:e.y,d:e.dir};if(e.recipe)o.r=e.recipe;if(e.filter)o.f=e.filter;if(e.items&&e.items.length)o.i=e.items.map(it=>[it.id,+it.p.toFixed(3)]);
      if(e.out&&e.out.length)o.o=e.out;if(e.inb&&Object.keys(e.inb).length)o.b=e.inb;if(e.rin)o.ri=e.rin;if(e.fq&&e.fq.length)o.fq=e.fq;if(e.energy)o.en=e.energy;if(e.charge)o.ch=e.charge;if(e.prog)o.p=e.prog;if(e.crafting)o.c=1;if(e.buf&&e.buf.length)o.bu=e.buf;if(e.mods&&e.mods.length)o.m=e.mods;if(e.pb)o.pb=e.pb;if(e.tq&&e.tq.length)o.tq=e.tq.map(it=>[it.id,+it.t.toFixed(2)]);return o}),rq});
}
function load(str){
  const s=JSON.parse(str);if(!s||s.v!==2)return false;
  seed=s.seed;ents=[];grid=new Array(W*H).fill(null);inv=s.inv||{};techs=new Set(s.techs||[]);techLv=s.techLv||{};active=s.active||null;paid=s.paid||{};delivered=s.delivered||{};made=s.made||{};playTime=s.playTime||0;genAuto=!!s.genAuto;won=!!s.won;launch=null;
  buckets=[];curMade={};curDel={};
  genWorld();makeHub();
  for(const o of s.ents||[]){if(!BUILD[o.t]||!inb(o.x,o.y)||grid[idx(o.x,o.y)])continue;const e=mkEnt(o.t,o.x,o.y,o.d);
    if(o.r)e.recipe=o.r;if(o.f)e.filter=o.f;if(o.i)e.items=o.i.map(([id,p])=>({id,p}));if(o.o)e.out=o.o;if(o.b)e.inb=o.b;if(o.ri)e.rin=o.ri;if(o.fq)e.fq=o.fq;if(o.en)e.energy=o.en;if(o.ch)e.charge=o.ch;if(o.p)e.prog=o.p;if(o.c)e.crafting=true;if(o.bu)e.buf=o.bu;if(o.m){e.mods=o.m;calcMods(e)}if(o.pb)e.pb=o.pb;if(o.tq)e._tq=o.tq}
  retunnel();
  for(const e of ents)if(e._tq){if(e.role==='in'&&e.pair)e.tq=e._tq.map(([id,t])=>({id,t}));else e._tq.forEach(([id])=>addInv(id));delete e._tq}
  rq=Array.isArray(s.rq)?s.rq.filter(id=>TECH_BY[id]):[];
  if(s.cam){cam.x=s.cam.x;cam.y=s.cam.y;zoom=s.cam.z||1}
  return true;
}
function save(){try{localStorage.setItem(SAVE_KEY,serialize())}catch(e){}}
setInterval(()=>save(),20000);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',()=>save());

// ================== WEBSITE: ACCOUNTS, SAVE SLOTS, CLOUD SAVE ==================
let gameReady=false,loopStarted=false,iconsMade=false,me=null,slot=1,guest=false,cloudBusy=false,lastCloudOk=0,saveLabel='';
let gateView='login',slotData=null,slotDelArm=0,gateErr='',gateBusy=false;
const gateEl=$('gate'),gboxEl=$('gbox'),acctBtn=$('acctBtn');
const GUEST_KEY=s=>`foundryline_guest_slot_${s}`;
async function api(p,opt={}){
  const r=await fetch('/api'+p,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const er=new Error(j.error||`Request failed (${r.status})`);er.status=r.status;throw er}
  return j;
}
function metaNow(){return{playTime:Math.floor(playTime),techs:techs.size,buildings:ents.length-1,won,day:Math.floor(playTime/DAY)+1}}
function ago(iso){if(!iso)return'';const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' days ago'}
function setSaveLabel(t){saveLabel=t;renderAcctBtn()}
function renderAcctBtn(){acctBtn.innerHTML=`${esc(guest?'Guest':me?me.username:'Account')} <kbd>${esc(saveLabel||'menu')}</kbd>`}

// ---- local + cloud saving (replaces the single-player save) ----
save=function(){
  if(!gameReady)return;
  let data;try{data=serialize()}catch(e){return}
  if(guest){try{localStorage.setItem(GUEST_KEY(slot),JSON.stringify({data,meta:metaNow(),at:new Date().toISOString()}));setSaveLabel('saved')}catch(e){setSaveLabel('storage full')}}
  else if(me){try{localStorage.setItem(`foundryline_backup_${me.username}_${slot}`,data)}catch(e){}}
};
async function cloudSave(){
  if(!gameReady||guest||!me||cloudBusy)return true;
  cloudBusy=true;setSaveLabel('saving');
  try{await api('/saves/'+slot,{method:'PUT',body:JSON.stringify({data:serialize(),meta:metaNow()})});lastCloudOk=Date.now();setSaveLabel('saved');return true}
  catch(e){if(e.status===401){setSaveLabel('signed out');toast('You were signed out. Open the account menu to log in again.')}else setSaveLabel('not saved');return false}
  finally{cloudBusy=false}
}
setInterval(()=>{if(gameReady&&!guest)cloudSave()},45000);
setInterval(()=>{if(gameReady&&!guest&&lastCloudOk)setSaveLabel(Date.now()-lastCloudOk<90000?'saved':'saved '+ago(new Date(lastCloudOk).toISOString()))},30000);
addEventListener('visibilitychange',()=>{if(document.hidden&&gameReady&&!guest)cloudSave()});
addEventListener('pagehide',()=>{
  if(!gameReady||guest||!me)return;
  try{const body=JSON.stringify({data:serialize(),meta:metaNow()});if(body.length<60000)navigator.sendBeacon('/api/saves/'+slot,new Blob([body],{type:'application/json'}))}catch(e){}
});
addEventListener('beforeunload',ev=>{if(gameReady&&!guest&&me&&Date.now()-lastCloudOk>50000){cloudSave();ev.preventDefault();ev.returnValue=''}});

// ---- blueprint sync ----
let bpTimer=null;
saveBP=function(){
  try{localStorage.setItem(BP_KEY,JSON.stringify(blueprints))}catch(e){}
  if(me&&!guest){clearTimeout(bpTimer);bpTimer=setTimeout(()=>api('/blueprints',{method:'PUT',body:JSON.stringify({blueprints})}).catch(()=>{}),1500)}
};
async function syncBlueprints(){
  try{const r=await api('/blueprints');const list=(r.blueprints||[]).filter(validBP);
    if(list.length)blueprints=list;else if(blueprints.length)saveBP()}catch(e){}
}

// ---- gate screens ----
function showGate(view){gameReady=false;gateView=view;gateErr='';slotDelArm=0;closeAll();gateEl.hidden=false;renderGate();if(view==='slots')loadSlots()}
function renderGate(){
  if(gateView==='login'||gateView==='register'){
    const reg=gateView==='register';
    gboxEl.className='gbox panel';
    gboxEl.innerHTML=`<h1 class="glogo">Foundry<span>Line</span></h1>
      <p class="gsub">Build a factory, automate every step, and launch a rocket. Log in to keep your factories in the cloud and play from any computer.</p>
      <div class="gtabs"><button class="btn ${reg?'':'on'}" data-g="tab-login" type="button">Log in</button><button class="btn ${reg?'on':''}" data-g="tab-register" type="button">Create account</button></div>
      <form id="authForm" autocomplete="on" novalidate>
        <div class="field"><label for="gUser">Username</label><input id="gUser" name="username" autocomplete="username" maxlength="24" required>${reg?'<small>3–24 letters, numbers, dashes or underscores.</small>':''}</div>
        <div class="field"><label for="gPass">Password</label><input id="gPass" name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" maxlength="200" required>${reg?'<small>At least 8 characters.</small>':''}</div>
        <div class="gerr" id="gErr" role="alert">${esc(gateErr)}</div>
        <button class="btn pri gbtn" type="submit" ${gateBusy?'disabled':''}>${gateBusy?'Please wait…':reg?'Create account':'Log in'}</button>
      </form>
      <div class="gor">or</div>
      <button class="btn gbtn" data-g="guest" type="button">Play as guest</button>
      <p class="gnote">Guest factories save only in this browser. You can create an account later.</p>`;
    const u=$('gUser');if(u)u.focus();
    $('authForm').addEventListener('submit',ev=>{ev.preventDefault();doAuth(reg)});
    return;
  }
  gboxEl.className='gbox panel wide';
  const who=guest?'Playing as guest · saves stay in this browser':`Signed in as ${esc(me.username)}`;
  let cards='';
  if(!slotData)cards='<p class="gsub">Loading your factories…</p>';
  else{
    cards='<div class="slots3">'+[1,2,3].map(s=>{const sv=slotData.find(x=>x.slot===s);
      if(!sv)return`<div class="scard empty"><div class="sn">Slot ${s}</div><div class="st2">Empty</div><div class="sm2">Start a fresh world with a new map.</div><div class="row"><button class="btn pri sm" data-g="new" data-s="${s}" type="button">Start new factory</button></div></div>`;
      const m=sv.meta||{};
      return`<div class="scard"><div class="sn">Slot ${s}${m.won?' · Launched':''}</div><div class="st2">Day ${m.day||1}</div>
        <div class="sm2">${m.techs||0} techs · ${m.buildings||0} buildings<br>Played ${fmtTime(m.playTime||0)}<br>Saved ${ago(sv.updated_at)}</div>
        <div class="row"><button class="btn pri sm" data-g="open" data-s="${s}" type="button">Continue</button>${slotDelArm===s?`<button class="btn sm danger" data-g="del2" data-s="${s}" type="button">Delete for good</button><button class="btn sm" data-g="del0" type="button">Keep</button>`:`<button class="btn sm" data-g="del" data-s="${s}" type="button">Delete</button>`}</div></div>`}).join('')+'</div>';
  }
  gboxEl.innerHTML=`<div class="ghead"><div><h1 class="glogo" style="font-size:38px">Foundry<span>Line</span></h1><p class="gwho">${who}</p></div>
    <div class="row" style="margin-top:0">${guest?'<button class="btn sm" data-g="toLogin" type="button">Log in or create account</button>':'<button class="btn sm" data-g="logout" type="button">Log out</button>'}</div></div>
    <p class="gsub">Pick a factory to continue, or start a new one. You have three save slots.</p>
    <div class="gerr" role="alert">${esc(gateErr)}</div>${cards}`;
}
async function doAuth(reg){
  const username=$('gUser').value.trim(),password=$('gPass').value;
  if(!username||!password){gateErr='Enter a username and password.';$('gErr').textContent=gateErr;return}
  gateBusy=true;gateErr='';renderGateKeep(username);
  try{const r=await api(reg?'/register':'/login',{method:'POST',body:JSON.stringify({username,password})});
    me={username:r.username};guest=false;gateBusy=false;await syncBlueprints();renderAcctBtn();showGate('slots')}
  catch(e){gateBusy=false;gateErr=e.message||'Could not reach the server.';renderGateKeep(username)}
}
function renderGateKeep(username){renderGate();const u=$('gUser');if(u)u.value=username;const p=$('gPass');if(p&&!gateBusy)p.focus()}
async function loadSlots(){
  slotData=null;renderGate();
  if(guest){
    slotData=[];for(let s=1;s<=3;s++){try{const v=localStorage.getItem(GUEST_KEY(s));if(v){const o=JSON.parse(v);slotData.push({slot:s,meta:o.meta,updated_at:o.at})}}catch(e){}}
    renderGate();return}
  try{const r=await api('/saves');slotData=r.saves||[]}
  catch(e){if(e.status===401){me=null;showGate('login');return}gateErr=e.message;slotData=[]}
  renderGate();
}
async function openSlot(s,isNew){
  slot=s;let data=null;
  if(!isNew){
    if(guest){try{data=JSON.parse(localStorage.getItem(GUEST_KEY(s))).data}catch(e){data=null}}
    else{try{data=(await api('/saves/'+s)).data}catch(e){gateErr=e.message;renderGate();return}}
  }
  beginGame(data);
}
function beginGame(str){
  if(!iconsMade){makeIcons();iconsMade=true}
  closeAll();
  let ok=false;if(str){try{ok=load(str)}catch(e){ok=false}}
  if(!ok)newGame();
  clearModes();
  simSpeed=1;setSpeed(1);
  buildHotbar();objDone=0;renderObjectives();updateUI();drawMini();updateModebar();
  gateEl.hidden=true;gameReady=true;lastCloudOk=ok?Date.now():0;
  setSaveLabel(guest?'browser save':'saved');
  if(!ok){openHelp();save();cloudSave()}
  if(!loopStarted){loopStarted=true;requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)})}
}
async function leaveGame(){
  if(gameReady){save();if(!guest&&!(await cloudSave())){toast('Could not save to the cloud. Try again in a moment.');return false}}
  gameReady=false;return true;
}
gateEl.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-g]');if(!b)return;const g=b.dataset.g,s=+b.dataset.s;
  if(g==='tab-login'){gateView='login';gateErr='';renderGate()}
  else if(g==='tab-register'){gateView='register';gateErr='';renderGate()}
  else if(g==='guest'){guest=true;me=null;loadBP();renderAcctBtn();showGate('slots')}
  else if(g==='toLogin'){guest=false;showGate('register')}
  else if(g==='logout'){try{await api('/logout',{method:'POST'})}catch(e){}me=null;loadBP();renderAcctBtn();showGate('login')}
  else if(g==='open')openSlot(s,false);
  else if(g==='new')openSlot(s,true);
  else if(g==='del'){slotDelArm=s;renderGate()}
  else if(g==='del0'){slotDelArm=0;renderGate()}
  else if(g==='del2'){slotDelArm=0;if(guest){try{localStorage.removeItem(GUEST_KEY(s))}catch(e){}}else{try{await api('/saves/'+s,{method:'DELETE'})}catch(e){gateErr=e.message}}loadSlots()}
});

// ---- in-game account menu ----
function acctHTML(){
  return`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><h2>${guest?'Guest':esc(me?me.username:'Account')}</h2>
    <p class="sub">Slot ${slot} · ${guest?'Saving in this browser only':lastCloudOk?'Last cloud save '+ago(new Date(lastCloudOk).toISOString()):'Not saved to the cloud yet'}</p></div><button class="btn" data-act="closem">Close <kbd>Esc</kbd></button></div>
    <div class="row">${guest?'':'<button class="btn pri" data-act="acctSave">Save now</button>'}<button class="btn" data-act="acctSwitch">Switch factory</button>${guest?'<button class="btn" data-act="acctLogin">Log in or create account</button>':'<button class="btn" data-act="acctLogout">Log out</button>'}</div>
    ${guest?'<p class="gnote">Guest saves live in this browser. To move this factory to an account, use Help → Export save, log in, start a new slot, then Help → Import save.</p>':'<p class="gnote">The game saves to the cloud every 45 seconds and when you switch tabs.</p>'}`;
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='acct'){openModal('acct',acctHTML())}
  else if(a==='acctSave'){const ok=await cloudSave();toast(ok?'Saved to the cloud':'Save failed. Check your connection.');if(!modalEl.hidden)sheetEl.innerHTML=acctHTML()}
  else if(a==='acctSwitch'){if(await leaveGame())showGate('slots')}
  else if(a==='acctLogout'){if(await leaveGame()){try{await api('/logout',{method:'POST'})}catch(e){}me=null;loadBP();renderAcctBtn();showGate('login')}}
  else if(a==='acctLogin'){if(await leaveGame()){guest=false;showGate('register')}}
});

// ---- start ----
(async function init(){
  loadBP();renderAcctBtn();
  try{const r=await api('/me');me={username:r.username};await syncBlueprints();renderAcctBtn();showGate('slots')}
  catch(e){showGate('login')}
})();

</script>

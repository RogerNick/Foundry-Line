<title>Foundry Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed canvas world, instrument-panel HUD pinned to the edges like a control room */
:root{
  --bg:#0b0d0c; --ink:#ece6d6; --dim:#8f978d; --panel:rgba(20,24,22,.92); --panel2:#222925; --line:#343d37;
  --amber:#f2a93b; --amber-ink:#1b1306; --good:#6cd17a; --bad:#ef5b4c; --blue:#5aa9f0; --warn:#e6b84a;
  --disp:'Saira Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#cv.tool{cursor:cell}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{font:800 22px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;color:var(--ink);display:flex;align-items:center}
.brand span{color:var(--amber)}
.meter{padding:7px 11px;min-width:200px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lab{display:flex;justify-content:space-between;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.lab b{font:500 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden}
.bar.thin{height:3px}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.menu{display:flex;gap:6px;padding:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:600 13px/1 var(--body);padding:8px 11px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible,.slot:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{border-color:#ef5b4c88;color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.btn.sm{padding:5px 8px;font-size:12px}
kbd{font:500 10px var(--mono);border:1px solid #fff3;border-bottom-width:2px;border-radius:3px;padding:1px 4px;color:var(--dim)}
.btn.pri kbd{color:var(--amber-ink);border-color:#0004}
#pbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:var(--topH,66px);z-index:4;display:flex;gap:4px;padding:5px;flex-wrap:wrap;max-width:calc(100vw - 360px)}
#pbar .btn{gap:7px}#pbar .btn.on{border-color:var(--amber);color:var(--amber);background:#f2a93b18}#pbar .pd{width:9px;height:9px;border-radius:50%;flex:none}#pbar .pw{width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:-3px}
#obj{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:var(--topH,66px);width:280px;padding:10px 12px;z-index:4}
.h{font:700 13px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h small{font:500 11px var(--mono);color:var(--dim);letter-spacing:0}
#obj ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
#obj li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3}
#obj li::before{content:"";flex:none;width:9px;height:9px;margin-top:4px;border:1.5px solid var(--dim);border-radius:2px}
#obj li.first{color:var(--ink)}#obj li.first::before{border-color:var(--amber);background:#f2a93b33}
#obj li:not(.first){color:var(--dim)}
#hotbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 182px);margin-inline:auto;width:fit-content;max-width:calc(100% - 206px);box-sizing:border-box;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:3px;padding:5px;z-index:5;overflow-x:auto;align-items:center}
.grp{display:flex;gap:3px;padding-right:5px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0;margin-right:0;padding-right:0}
.slot{position:relative;width:42px;height:42px;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:5px;cursor:pointer;padding:0;display:grid;place-items:center}
.slot canvas{width:30px;height:30px}
.slot .k{position:absolute;left:3px;top:1px;font:500 9px var(--mono);color:var(--dim)}
.slot .lock{position:absolute;right:2px;bottom:2px;width:14px;height:14px;display:none;place-items:center;background:#0b0d0ce6;border-radius:4px}
.slot.locked canvas{opacity:.35;filter:grayscale(1)}
.slot .lock::after{content:"";width:7px;height:5px;margin-top:3px;border:1.5px solid #b5c4c8;border-radius:1px;box-shadow:0 -3px 0 -1px #0b0d0c,0 -4px 0 0 #b5c4c8}
.slot.locked .lock{display:grid}
.slot.poor::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.slot.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber),0 0 14px #f2a93b44}
.slot:hover{border-color:#f2a93b99}
#tip{position:fixed;z-index:20;pointer-events:none;width:260px;padding:10px 12px;font-size:13px}
#tip .t{font:700 17px/1.1 var(--disp);letter-spacing:.03em;margin-bottom:4px}
#tip p{margin:4px 0 8px;color:var(--dim);line-height:1.35}
.costs{display:flex;flex-wrap:wrap;gap:4px}
.cost{display:inline-flex;align-items:center;gap:3px;font:500 12px var(--mono);background:#0005;border-radius:4px;padding:2px 5px 2px 3px;font-variant-numeric:tabular-nums}
.cost img{width:16px;height:16px}
.cost.no{color:var(--bad)}
.cost.ok{color:var(--ink)}
#modebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:5;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
#modebar .m{font:700 15px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
#modebar .d{color:var(--dim);font-size:13px}
#mini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:170px;height:170px;z-index:4;border:1px solid var(--line);border-radius:6px;background:#000;cursor:pointer;image-rendering:pixelated}
#hover{position:fixed;left:0;top:0;font:500 13px/1.4 var(--body);color:var(--ink);z-index:12;padding:8px 11px;max-width:280px;pointer-events:none}
#hover .ht{font:700 15px/1.1 var(--disp);letter-spacing:.03em}
#hover .hs{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
#hover .hw{color:var(--dim);margin-top:3px}
#hover .hk{font:500 11px var(--mono);color:var(--dim);margin-top:5px}
.ohint{color:var(--dim);font-size:12px;line-height:1.4;margin:-2px 0 2px 17px}
.drawer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:var(--topH,66px);width:340px;max-height:calc(100% - 180px);overflow:auto;padding:12px;z-index:6}
#inspector{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:var(--topH,66px);width:310px;max-height:calc(100% - var(--topH,66px) - 220px);overflow:auto;padding:12px;z-index:6}
.ititle{font:700 22px/1 var(--disp);letter-spacing:.02em;margin:6px 0 4px}
.stat{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:3px;background:#0005}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-nopole{color:#b48cff}.s-ok{color:var(--good)}.s-idle{color:var(--warn)}.s-block{color:var(--bad)}.s-nopower{color:var(--blue)}.s-norecipe{color:var(--dim)}
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sec>.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:7px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0;align-items:center}
.kv b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.kv img{vertical-align:-3px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.pick button{aspect-ratio:1;max-width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:3px;display:grid;place-items:center}
.pick button img{width:24px;height:24px}
.pick button.on{border-color:var(--amber);background:#f2a93b22}
.pick button:hover{border-color:#f2a93baa}
.slots{display:flex;gap:5px;flex-wrap:wrap}
.mslot{width:40px;height:40px;border:1px dashed #8f978d88;border-radius:5px;display:grid;place-items:center;background:#0004;cursor:pointer;padding:0}
.mslot.full{border-style:solid;border-color:var(--line);background:var(--panel2)}
.mslot img{width:28px;height:28px}
.recipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:500 12px var(--mono)}
.recipe .arrow{color:var(--dim)}
.pbar{height:5px;background:#0007;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--amber)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.it img{width:28px;height:28px}
.it b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.it span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.craft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st td{padding:4px 3px;border-bottom:1px solid #ffffff0d;vertical-align:middle}
table.st td.n{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.st th{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);text-align:right;padding:0 3px 6px}
table.st th:first-child{text-align:left}
table.st img{width:20px;height:20px;vertical-align:middle;margin-right:5px}
.bp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:7px}
.bp.on{border-color:var(--amber)}
.bp .top{display:flex;gap:9px;align-items:center}
.bp .top img{width:72px;height:54px;flex:none;background:#0b0d0c;border-radius:4px;image-rendering:pixelated}
.bp .nm{font:700 16px/1.1 var(--disp);letter-spacing:.02em;word-break:break-word}
.bp .meta{font:500 11px var(--mono);color:var(--dim)}
.bp input,.ta{width:100%;background:#0b0d0c;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 7px;font:500 13px var(--body);box-sizing:border-box}
.ta{font:500 11px var(--mono);height:70px;resize:vertical}
.bplist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#modal{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:16px}
.sheet{width:min(1240px,100%);max-height:88vh;overflow:auto;padding:18px 20px}
.sheet h2{font:800 30px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0}
.sheet .sub{color:var(--dim);margin:6px 0 14px;max-width:70ch}
.tree{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.sheet.techsheet{display:flex;flex-direction:column;height:88vh;overflow:hidden}.sheet.techsheet>.tree{flex:1;min-height:0;overflow:auto;cursor:grab;align-items:flex-start;padding-right:4px}.sheet.techsheet>.tree.grabbing{cursor:grabbing;user-select:none}
.sheet.techsheet>.tree::-webkit-scrollbar{height:12px;width:10px}.sheet.techsheet>.tree::-webkit-scrollbar-thumb{background:#4a6272;border-radius:6px;border:2px solid #0f1a22}.sheet.techsheet>.tree::-webkit-scrollbar-track{background:#0f1a22;border-radius:6px}.sheet.techsheet>.tree{scrollbar-color:#4a6272 #0f1a22}
.tier{display:flex;flex-direction:column;gap:8px;flex:none;width:224px}
.tier>.lbl{font:600 11px var(--mono);color:var(--dim);letter-spacing:.06em}
.tech{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px}
.tech .nm{font:700 17px/1.05 var(--disp);letter-spacing:.02em;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tech .nm small{font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tech p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.35}
.tech.done{opacity:.5}.tech.done .nm small{color:var(--good)}
.tech.locked{opacity:.42}
.tech.ready .nm small{color:var(--ink)}
.tech.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.tech.active .nm small{color:var(--amber)}
.tech .req{font-size:11px;color:var(--dim)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn.on{border-color:var(--amber);color:var(--amber)}
/* item hover label */
#itip{position:fixed;z-index:40;pointer-events:none;max-width:280px;padding:8px 11px;font-size:13px;line-height:1.35}
#itip .t{font:700 15px/1.15 var(--disp);letter-spacing:.03em}#itip .d{color:var(--ink);margin-top:3px}#itip .k{color:var(--dim);font:500 11px var(--mono);margin-top:4px}
/* recipe book */
.rb-search{background:#0b0d0c;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:8px 10px;font:500 14px var(--body);width:min(320px,100%);box-sizing:border-box}
.rb-search:focus{outline:2px solid var(--amber);outline-offset:0}
.rb-body{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
@media(max-width:1000px){.rb-body{grid-template-columns:1fr}}
.rb-list{max-height:64vh;overflow:auto;padding-right:4px;min-width:0}
.rb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.rb-item{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);cursor:pointer;min-width:0}
.rb-item img{grid-row:span 2}.rb-item .nm{font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rb-item .tm{font:500 11px var(--mono);color:var(--dim)}
.rb-item:hover{border-color:#f2a93b99}.rb-item.sel{border-color:var(--amber);background:#f2a93b18}.rb-item.locked{opacity:.5}
.rb-detail{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;max-height:64vh;overflow:auto;min-width:0}
.rb-recipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rb-recipe .plus,.rb-recipe .arr{color:var(--dim);font:600 16px var(--mono)}
.rb-chip{display:inline-flex;align-items:center;gap:6px;background:#0005;border:1px solid var(--line);border-radius:6px;padding:4px 8px 4px 5px;color:var(--ink);cursor:pointer;font:500 12.5px var(--body)}
.rb-chip b{font:600 13px var(--mono)}.rb-chip:hover{border-color:var(--amber)}
.rb-table{width:100%;border-collapse:collapse;font-size:13px}
.rb-table th{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;padding:0 4px 6px}
.rb-table td{padding:5px 4px;border-top:1px solid #ffffff0d;font-variant-numeric:tabular-nums}.rb-table td:nth-child(n+2){font-family:var(--mono);font-size:12px}
.rb-table td img{vertical-align:-3px}.rb-table tr.dim td{color:var(--dim)}.rb-table small{font:500 10px var(--body);color:var(--dim)}
.rb-ratio{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid #ffffff0d}
.rb-ratio small{font:500 11px var(--mono);color:var(--dim)}
.rb-use{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 6px;color:var(--ink);cursor:pointer}
.rb-use:hover{background:#ffffff08;border-color:var(--line)}.rb-use span{display:flex;flex-direction:column}.rb-use small{color:var(--dim);font-size:11.5px}
.pick button{position:relative}.pick button .pt{position:absolute;right:2px;bottom:1px;font:600 9px var(--mono);color:var(--dim);line-height:1}
.inv .it{cursor:pointer}.inv .it:hover{border-color:#f2a93b99}
/* production screen */
.pr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pr-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;gap:3px}.seg .btn.on{border-color:var(--amber);color:var(--amber);background:#f2a93b18}
.pr-sum{display:flex;gap:6px;margin-left:auto}
.chip{font:600 12px var(--body);padding:4px 9px;border-radius:99px;background:#0005;border:1px solid var(--line)}
.chip.bad{color:var(--bad)}.chip.good{color:var(--good)}
.pr-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:900px){.pr-body{grid-template-columns:1fr}}
.pr-table{min-width:0;display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto;padding-right:4px}
.pr-row{box-sizing:border-box;display:grid;grid-template-columns:minmax(140px,1.5fr) 62px 56px 56px minmax(110px,1.3fr) 50px 104px;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;color:var(--ink);font:500 13.5px var(--body);cursor:pointer}
.pr-row:hover{background:#ffffff08;border-color:var(--line)}
.pr-row.sel{background:#f2a93b14;border-color:var(--amber)}
.pr-th{cursor:default;font:600 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);position:sticky;top:0;background:var(--panel);z-index:1}
.pr-th:hover{background:var(--panel);border-color:transparent}
.pr-cat{font:700 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);padding:10px 8px 3px}
.it-n{display:flex;align-items:center;gap:8px;min-width:0}.it-n>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-n em:has(span:empty){display:none}
.it-n em{font:600 10.5px var(--body);font-style:normal;color:var(--warn);background:#e6b84a1c;border:1px solid #e6b84a55;border-radius:99px;padding:1px 6px;white-space:nowrap}
.pr-row .n{text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-row .n small{font-size:9px;margin-left:3px}.pr-row .n small.up{color:var(--good)}.pr-row .n small.down{color:var(--bad)}
.pr-row .mach{font-size:12px;color:var(--dim)}.pr-row .mach small{font:500 10.5px var(--body)}
.pos{color:var(--good)}.negc{color:var(--bad)}
.bal-h{text-align:center}
.bal{position:relative;display:grid;grid-template-columns:1fr 1fr;height:14px;background:#0005;border-radius:4px;overflow:hidden}
.bal::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line)}
.bal .l{display:flex;justify-content:flex-end}.bal .r{display:flex}
.bal i{display:block;height:100%;transition:width .3s}
.bal .l i{background:linear-gradient(90deg,#ef5b4c55,#ef5b4ccc)}.bal .r i{background:linear-gradient(90deg,#6cd17acc,#6cd17a55)}
.pr-row .bv{text-align:left;font-weight:600}
.pr-row .chev{display:inline-block;width:12px;color:var(--dim);font-size:11px}.pr-row.open{background:#ffffff08}

      const d=dist(x,y);if(d<near+6){dir+=0.5;continue}
      for(let oy=-w;oy<=w;oy++)for(let ox=-w;ox<=w;ox++){const tx=Math.round(x+ox),ty=Math.round(y+oy);if(inb(tx,ty)&&ox*ox+oy*oy<=w*w+1)terr[idx(tx,ty)]=1}
      if(x<-5||y<-5||x>W+5||y>H+5)break}}
  if(def.growth)for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);if(terr[i]||dist(x,y)<near-6)continue;if(jungleZone(x,y))terr[i]=3}

  const clear=(cx,cy,r)=>{for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++)if(inb(x,y)&&Math.hypot(x-cx,y-cy)<=r)terr[idx(x,y)]=0};
  const blob=(type,cx,cy,r)=>{for(let y=Math.floor(cy-r-3);y<=cy+r+3;y++)for(let x=Math.floor(cx-r-3);x<=cx+r+3;x++){if(!inb(x,y))continue;const i=idx(x,y);if(terr[i]&&terr[i]!==3)continue;

  for(let k=0;k<def.patches;k++){const cx=8+R()*(W-16),cy=8+R()*(H-16),dd=dist(cx,cy);if(dd<26)continue;const[t,r]=def.pick(R,dd);if(t)blob(t,cx,cy,r)}

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),o=ore[i];if(!o||ORE_NORICH.has(o))continue;const d=dist(x,y);if(d<28)continue;

    for(let i=0;i<W*H;i++){if(seen[i]||isBlockedI(i))continue;const ox=i%W,oy=(i/W)|0;
      let x=ox,y=oy;for(let g=0;g<W+H&&!seen[idx(x,y)];g++){const dx=Math.sign(HX-x),dy=Math.sign(HY-y);if(Math.abs(HX-x)>Math.abs(HY-y))x+=dx;else y+=dy;
        for(const[ax,ay]of[[x,y],[x+1,y],[x,y+1]])if(inb(ax,ay)&&terr[idx(ax,ay)]&&terr[idx(ax,ay)]!==3)terr[idx(ax,ay)]=0}
      fixed=true;break}
    if(!fixed)break}

function pasteBP(tx,ty){

    if(st==='same'){const e=at(x,y);e.dir=c.d;if(c.r&&e.recipe!==c.r&&BUILD[e.type].cat==='crafter'&&unlockedR(c.r))setRecipe(e,c.r);if(c.f&&(e.type==='filter'||e.type==='depot'))e.filter=c.f;continue}

function itemTech(id){

  const sk=smeltFor(id);if(sk)return SMELT[sk].tech||null;
  return RECIPES[id]?RECIPES[id].tech||null:null;
}
const itemUnlocked=id=>{const t=itemTech(id);return!t||has(t)};
// Every machine that can make an item, with time per craft and output per minute at today's speed
function makersOf(id){
  const m=machineMult(),out=[],B=Object.keys(BUILD);
  if(isOre(id)){const o=ORE_ITEM.indexOf(id);
    for(const t of B)if(BUILD[t].cat==='miner'&&BUILD[t].ores.includes(o))out.push({type:t,time:1/(BUILD[t].rate*m),perMin:60*BUILD[t].rate*m,inPer:{}})}
  for(const t of B){const b=BUILD[t];if(b.cat!=='extract')continue;const tot=b.harvest?1:b.makes.reduce((a,q)=>a+q[1],0),w=b.harvest?(id==='biomass'?1:0):(b.makes.find(q=>q[0]===id)||[0,0])[1];
    if(w)out.push({type:t,time:tot/(w*b.rate*m),perMin:60*b.rate*m*w/tot,inPer:{}})}
  if(smeltFor(id)){const k=smeltFor(id),r=SMELT[k];
    for(const t of B){if(BUILD[t].cat!=='smelter')continue;const tt=r.t/(BUILD[t].spd*m);out.push({type:t,time:tt,perMin:60/tt,inPer:{[k]:60/tt*r.n}})}}
  else if(RECIPES[id]){const r=RECIPES[id],rc=recipeCat(id);
    for(const t of B){if(BUILD[t].cat!=='crafter'||BUILD[t].rc!==rc)continue;const tt=r.t/(BUILD[t].spd*m),per={};for(const k in r.in)per[k]=60/tt*r.in[k];out.push({type:t,time:tt,perMin:60/tt*r.out,inPer:per})}}
  return out;
}
function recipeOf(id){
  if(isOre(id))return null;const sk=smeltFor(id);if(sk)return{in:{[sk]:SMELT[sk].n},out:1,t:SMELT[sk].t,machine:'Smelter'};
  const r=RECIPES[id];return r?{in:r.in,out:r.out,t:r.t,machine:r.cat==='refine'?'Refinery':'Assembler'}:null;
}
// Smallest whole-number pair p:c with p producers keeping c consumers busy
function ratioOf(need,supply){
  if(!supply)return null;const x=need/supply;
  for(let c=1;c<=12;c++){const p=x*c;if(Math.abs(p-Math.round(p))<0.02&&Math.round(p)>0)return[Math.round(p),c]}
  return[+x.toFixed(2),1];
}
function usedIn(id){
  const rec=[];for(const k in RECIPES)if(RECIPES[k].in[id])rec.push(k);
  const sm=SMELT[id]?SMELT[id].out:null;
  const blds=Object.keys(BUILD).filter(b=>BUILD[b].cost[id]);
  const res=TECH.filter(t=>t.cost[id]);
  const fuel=Object.keys(BUILD).filter(b=>BUILD[b].fuels&&BUILD[b].fuels.includes(id));
  const mods=Object.keys(BUILD).filter(b=>MODS[id]&&BUILD[b].slots);
  return{rec,sm,blds,res,fuel,mod:!!MODS[id]};
}
// One-line summary for hover labels
function itemSummary(id){
  if(!ITEMS[id])return'';
  if(id==='crude_oil')return`Pumped from oil seeps by a Pumpjack · ${fmtPM(60*BUILD.pump.rate*machineMult())}/min each`;
  if(isOre(id))return`Mined by a Mining Drill · ${fmtPM(60*BUILD.miner.rate*machineMult())}/min each, or hold click on ore`;
  const r=recipeOf(id);if(!r)return'';const base=makersOf(id)[0];
  return`${Object.keys(r.in).map(k=>r.in[k]+' '+N(k)).join(' + ')} → ${r.out} ${N(id)} · ${fmtT(base.time)} in ${an(BUILD[base.type].name)}`+(itemUnlocked(id)?'':` · needs ${TECH_BY[itemTech(id)].name}`);
}

let rbSel=null,rbQuery='',rbLocked=false;
function openRecipes(id){
  if(!modalEl.hidden&&modalEl.dataset.kind==='recipes'&&!id){closeModal();return}
  if(id)rbSel=id;if(!rbSel||!ITEMS[rbSel])rbSel='iron_plate';
  openModal('recipes',`<div class="pr-head"><div><h2>Recipe book</h2><p class="sub">How every item is made, which machines make it, how long each craft takes, and how many machines feed each other.</p></div><button class="btn" data-act="closem">Close <kbd>Esc</kbd></button></div>
    <div class="pr-bar"><input id="rbSearch" class="rb-search" type="search" placeholder="Search items" autocomplete="off" value="${esc(rbQuery)}"><button class="btn sm ${rbLocked?'on':''}" data-act="rblocked" id="rbLockBtn">Show locked</button></div>
    <div class="rb-body"><div class="rb-list" id="rbList"></div><aside class="rb-detail" id="rbDetail"></aside></div>`);
  const q=$('rbSearch');q.addEventListener('input',()=>{rbQuery=q.value;renderRbList()});
  renderRbList();renderRbDetail();
}
function renderRbList(){
  const el=$('rbList');if(!el)return;const q=rbQuery.trim().toLowerCase();let h='',any=false;
  for(const[cat,ids]of CATS){const list=ids.filter(id=>(rbLocked||itemUnlocked(id))&&(!q||N(id).toLowerCase().includes(q)));if(!list.length)continue;any=true;
    h+=`<div class="pr-cat">${cat}</div><div class="rb-grid">${list.map(id=>{const lk=!itemUnlocked(id),mk=makersOf(id)[0];
      return`<button class="rb-item ${rbSel===id?'sel':''} ${lk?'locked':''}" data-act="rbsel" data-r="${id}">${img(id,28)}<span class="nm">${N(id)}</span><span class="tm">${lk?'Locked':mk?(isOre(id)?fmtPM(mk.perMin)+'/min':fmtT(mk.time)):''}</span></button>`}).join('')}</div>`}
  el.innerHTML=any?h:'<p class="pr-empty">No items match that search.</p>';
}
function renderRbDetail(){
  const el=$('rbDetail');if(!el)return;const id=rbSel,r=recipeOf(id),mk=makersOf(id),u=usedIn(id),lk=!itemUnlocked(id),tech=itemTech(id);
  const chip=(k,n)=>`<button class="rb-chip" data-act="rbsel" data-r="${k}">${img(k,22)}<b>${n}</b><span>${N(k)}</span></button>`;
  let h=`<div class="pr-dh">${img(id,48)}<div><div class="ititle">${N(id)}</div><div class="pr-note">${CATS.find(c=>c[1].includes(id))?.[0]||''}${HANDCRAFT.includes(id)?' · Hand craftable (I)':''}${tech?` · ${lk?'Unlocks with':'Unlocked by'} ${TECH_BY[tech].name}`:''}</div></div></div>`;
  if(lk)h+=`<div class="pr-advice bad">Research <b>${TECH_BY[tech].name}</b> to make this.</div>`;
  // recipe
  if(r){h+=`<div class="sec"><div class="lbl">Recipe</div><div class="rb-recipe">${Object.keys(r.in).map(k=>chip(k,r.in[k])).join('<span class="plus">+</span>')}<span class="arr">→</span>${chip(id,r.out)}</div>
      <div class="pr-note">Takes <b>${fmtT(r.t)}</b> in ${an(r.machine)} at 1× speed${machineMult()>1?`, ${fmtT(r.t/machineMult())} with your Machine Tuning bonus`:''}.</div></div>`}
  else if(isOre(id))h+=`<div class="sec"><div class="lbl">Source</div><div class="pr-note">${id==='crude_oil'?'Found as dark oil seeps on the map. Place a Pumpjack on one.':'Found as ore patches on the map. Place a Mining Drill on it, or hold click on the ore to mine by hand.'}</div></div>`;
  // machines
  if(mk.length)h+=`<div class="sec"><div class="lbl">${isOre(id)?'Extracted by':'Made in'}</div><table class="rb-table"><tr><th>Machine</th><th>${isOre(id)?'Per item':'Per craft'}</th><th>Output</th>${r?'<th>Needs</th>':''}</tr>${mk.map(m=>{const ul=unlockedB(m.type);
      return`<tr class="${ul?'':'dim'}"><td>${BUILD[m.type].name}${ul?'':' <small>locked</small>'}</td><td>${fmtT(m.time)}</td><td><b>${fmtPM(m.perMin)}</b>/min</td>${r?`<td>${Object.keys(m.inPer).map(k=>`${fmtPM(m.inPer[k])} ${img(k,14)}`).join(' ')}</td>`:''}</tr>`}).join('')}</table></div>`;
  // ratios at base tier
  if(r&&mk.length){const base=mk[0];const rows=Object.keys(base.inPer).map(k=>{const src=makersOf(k)[0];if(!src)return'';const ra=ratioOf(base.inPer[k],src.perMin);
      return`<div class="rb-ratio">${img(k,18)}<span><b>${ra[0]} ${BUILD[src.type].name}${ra[0]>1?'s':''}</b> making ${N(k)} → <b>${ra[1]} ${BUILD[base.type].name}${ra[1]>1?'s':''}</b> making ${N(id)}</span><small>${fmtPM(base.inPer[k])}/min each</small></div>`}).join('');
    if(rows)h+=`<div class="sec"><div class="lbl">Machine ratios</div>${rows}<p class="pr-note">Using the basic tier of each machine. Mk2 machines count as 2 and Mk3 as 4. Speed research boosts every machine equally, so these ratios always hold.</p></div>`}
  // what feeds on it
  const usedRows=[];
  for(const k of u.rec){const rr=RECIPES[k];usedRows.push(`<button class="rb-use" data-act="rbsel" data-r="${k}">${img(k,22)}<span><b>${N(k)}</b><small>needs ${rr.in[id]} per craft · ${rr.cat==='refine'?'Refinery':'Assembler'}${unlockedR(k)?'':' · locked'}</small></span></button>`)}
  if(u.sm)usedRows.push(`<button class="rb-use" data-act="rbsel" data-r="${u.sm}">${img(u.sm,22)}<span><b>${N(u.sm)}</b><small>smelt ${SMELT[id].n} into 1 · Smelter</small></span></button>`);
  const extra=[];
  if(u.fuel.length)extra.push(`Fuel for ${u.fuel.map(b=>BUILD[b].name).join(' and ')} (${fmtPM(FUEL[id]*30/1000)} MJ each)`);
  if(u.mod)extra.push('Goes into module slots of drills, smelters, assemblers and refineries');
  if(u.blds.length)extra.push('Builds: '+u.blds.map(b=>`${BUILD[b].name} (${BUILD[b].cost[id]})`).join(', '));
  if(u.res.length)extra.push('Research: '+u.res.map(t=>`${t.name} (${fmt(t.cost[id])})`).join(', '));
  h+=`<div class="sec"><div class="lbl">Used in</div>${usedRows.join('')||(extra.length?'':'<p class="pr-note">Nothing uses this directly.</p>')}${extra.map(x=>`<p class="pr-note">${x}</p>`).join('')}</div>`;
  h+=`<div class="row"><button class="btn sm" data-act="prodopen" data-r="${id}">See in Production (P)</button></div>`;
  el.innerHTML=h;el.scrollTop=0;
}

function spark60(id){const vals=buckets.map(b=>b.m[id]||0);const mx=Math.max(1,...vals);const w=64,h=18;if(vals.length<2)return'';const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-1-v/mx*(h-2)).toFixed(1)}`).join(' ');return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="0,${h} ${pts} ${w},${h}" fill="#f2a93b22" stroke="none"/><polyline points="${pts}" fill="none" stroke="#f2a93b" stroke-width="1.4"/></svg>`}

function setHTML(el,h){if(el._h!==h){el.innerHTML=h;el._h=h;el._sk=null;return true}return false}
// Values inside <b data-live>, <span data-live> and bar widths marked data-lw are patched in place;
// anything else that changes rebuilds the panel. Keeps buttons under the cursor stable.
function setLive(el,h){
  const vals=[];
  const sk=h.replace(/<(b|span|em) data-live>([^<]*)<\/\1>|data-lw style="width:([0-9.]+)%|data-lp points="([^"]*)"/g,(m,t,v,w,pts)=>{
    if(t){vals.push(['t',v]);return`<${t} data-live></${t}>`}if(w!==undefined){vals.push(['w',w+'%']);return'data-lw style="width:%'}vals.push(['p',pts]);return'data-lp points=""'});
  if(el._sk===sk){const nodes=el.querySelectorAll('[data-live],[data-lw],[data-lp]');
    if(nodes.length===vals.length){nodes.forEach((n,i)=>{const[k,v]=vals[i];if(k==='t'){if(n.innerHTML!==v)n.innerHTML=v}else if(k==='w'){if(n.style.width!==v)n.style.width=v}else if(n.getAttribute('points')!==v)n.setAttribute('points',v)});el._h=h;return false}}
  el._sk=sk;el._h=h;el.innerHTML=h;return true;
}

   <div><h3>Move & panels</h3><dl><dt>WASD</dt><dd>Pan the map. Drag empty ground too</dd><dt>Space + drag</dt><dd>Pan while building</dd><dt>Scroll</dt><dd>Zoom</dd><dt>Click building</dt><dd>Recipe, modules, fuel, upgrade</dd><dt>T / I / P</dt><dd>Research, inventory, production screen</dd><dt>G</dt><dd>Recipe book: how every item is made, and machine ratios</dd><dt>, and .</dt><dd>Slow down or speed up: pause, 1×, 2×, 4×</dd><dt>M</dt><dd>Sound on or off</dd><dt>[ and ]</dt><dd>Switch planet (after the first colony)</dd><dt>O / K / J</dt><dd>Trade routes / the Ark / Expeditions (after the Ark launches)</dd></dl></div>

document.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;ev.preventDefault();onAct(ev)});
// keyboard activation (Enter/Space) still arrives as a click with detail 0
document.addEventListener('click',ev=>{if(ev.detail===0)onAct(ev)});
function onAct(ev){
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,r=b.dataset.r,i=+b.dataset.i;
  switch(a){
    case'inv':toggleDrawer(invEl);break;case'stats':openProd();break;case'lib':toggleDrawer(libEl);break;case'tech':openTech();break;case'help':openHelp();break;
    case'close':closeInspector();break;case'closem':closeModal();break;
    case'hc':handCraft(r,+b.dataset.n);break;
    case'recipe':if(inspected){setRecipe(inspected,r);renderInspector()}break;
    case'filter':if(inspected){inspected.filter=inspected.filter===r?null:r;blip(600,0.05,'triangle');renderInspector()}break;
    case'fuel':if(inspected){feed(inspected);renderInspector()}break;
    case'take':if(inspected){inspected.buf.forEach(addInv);inspected.buf=[];renderInspector()}break;
    case'rot':if(inspected){inspected.dir=(inspected.dir+1)%4;if(inspected.type==='tunnel')retunnel();blip(520,0.03)}break;
    case'copy':if(inspected)pipette(inspected);break;
    case'del':if(inspected)removeAt(inspected.x,inspected.y);break;
    case'upg':if(inspected){const res=upgradeEnt(inspected);if(res==='ok'){blip(880,0.1,'triangle',0.04);toast(`Upgraded to ${BUILD[inspected.type].name}`)}renderInspector()}break;
    case'modin':if(inspected&&(inv[r]||0)>0&&inspected.mods.length<BUILD[inspected.type].slots){inv[r]--;inspected.mods.push(r);calcMods(inspected);blip(700,0.06,'triangle');renderInspector()}break;
    case'modout':if(inspected){const m=inspected.mods.splice(i,1)[0];if(m)addInv(m);calcMods(inspected);blip(400,0.05,'triangle');renderInspector()}break;
    case'research':startResearch(r);renderTech();break;
    case'craftmiss':craftMissing(r);if(!modalEl.hidden&&modalEl.dataset.kind==='tech')renderTech();break;
    case'recipes':openRecipes();break;
    case'recipeopenm':closeModal();openRecipes(r);break;
    case'recipeopen':closeAll();openRecipes(r);break;
    case'rbsel':rbSel=r;renderRbList();renderRbDetail();break;
    case'rblocked':rbLocked=!rbLocked;{const bt=$('rbLockBtn');if(bt)bt.classList.toggle('on',rbLocked)}renderRbList();break;
    case'prodopen':closeModal();prodSel=r;openProd();break;
    case'prodsel':if(prodOpen.has(r)){prodOpen.delete(r);if(prodSel===r)prodSel=null}else{prodOpen.add(r);prodSel=r}renderProd();break;
    case'prodplanet':prodPlanet=r==='all'?'all':+r;prodSel=null;renderProd();break;
    case'invplanet':invPlanet=r==='all'?'all':+r;renderInv();break;
    case'prodwin':prodWin=+r;renderProd();break;
    case'prodfilter':prodFilter=r;renderProd();break;
    case'prodfind':prodFindStalled(r);break;
    case'prio':if(inspected&&inspected.type==='psplit'){inspected.prio=r;blip(600,0.05,'triangle');renderInspector()}break;
    case'alertgo':alertGo(r);break;
    case'planet':if(!modalEl.hidden&&modalEl.dataset.kind==='colony')closeModal();switchPlanet(i);break;
    case'trade':openTrade();break;
    case'located':{const d=PTYPES[r],n=ROCKET_NEED[r];openModal('loc',`<h2 style="color:${d.col}">${d.name}</h2><p class="sub">${d.blurb}</p><div class="sec"><div class="lbl">The rocket needs</div>${Object.keys(n).map(k=>`<div class="kv"><span>${img(k,18)} ${N(k)}</span><b>${n[k]}</b></div>`).join('')}</div><p style="color:var(--dim);font-size:13px">Build a Rocket Silo (group 2), feed it these parts, then click it and press Launch.</p><div class="row"><button class="btn pri" data-act="closem">OK</button></div>`);break}
    case'rsload':if(inspected&&inspected.type==='rsilo'){rsLoad(inspected);renderInspector()}break;
    case'rsdest':if(inspected&&inspected.type==='rsilo'){const x=rsX(inspected);if(x.dest!==r){for(const k in x.parts)addInv(k,x.parts[k]);x.parts={};x.dest=r}renderInspector()}break;
    case'rslaunch':if(inspected&&inspected.type==='rsilo')launchRocket(inspected);break;
    case'tradego':{const[tx,ty]=r.split(',').map(Number);closeModal();switchPlanet(i);const e=at(tx,ty);if(e){cam.x=tx*T+T/2;cam.y=ty*T+T/2;if(zoom<1)zoom=1.2;openInspector(e)}break}
    case'dprole':if(inspected&&inspected.type==='dport'){const x=dportX(inspected);if(x.role!==r){x.role=r;if(r==='recv'){inspected.buf.forEach(addInv);inspected.buf=[]}}blip(600,0.05,'triangle');renderInspector()}break;
    case'dpch':if(inspected&&inspected.type==='dport'){dportX(inspected).ch=i;blip(600,0.05,'triangle');renderInspector()}break;
    case'ark':openArk();break;
    case'exposend':expoSend(i);break;case'exporeroll':if(expo.offers[i]){expo.offers[i]=expoNewOffer();renderExpo()}break;
    case'expobuy':{const u=EXPO_UP.find(q=>q.id===r),l=expo.up[r]||0;if(u&&l<u.max&&expo.pts>=u.cost(l)){expo.pts-=u.cost(l);expo.up[r]=l+1;applyExpo();chord();toast(`${u.name}${u.max>1?' level '+(l+1):''}`,true);renderExpo()}break}
    case'expo':openExpo();break;
    case'arkpull':ark.pull=!ark.pull;renderArk();if(inspected&&inspected.type==='gantry')renderInspector();break;case'arklaunch':launchArk();break;
    case'arkshow':{closeModal();if(curP!==0)switchPlanet(0);const g=arkGantry();if(g){cam.x=(g.x+4.5)*T;cam.y=(g.y+4.5)*T;zoom=Math.min(zoom,.8);openInspector(g)}break}
    case'silodest':if(inspected&&inspected.type==='silo'){siloX(inspected).dest=i;blip(600,0.05,'triangle');renderInspector()}break;
    case'siloflt':if(inspected&&inspected.type==='silo'){const x=siloX(inspected),j=x.flt.indexOf(r);if(j>=0)x.flt.splice(j,1);else if(x.flt.length<4)x.flt.push(r);else toast('A silo takes up to 4 item types. Remove one first.');blip(600,0.05,'triangle');renderInspector()}break;
    case'silogo':if(inspected&&inspected.type==='silo'){const x=siloX(inspected);x.go=true;toast(siloFuelHave(x)<SILO_FUEL?`Launch is waiting for ${SILO_FUEL} Rocket Fuel.`:'Charging for launch');renderInspector()}break;
    case'siloload':if(inspected&&inspected.type==='silo'){siloLoad(inspected);renderInspector()}break;
    case'cancelr':{const t=TECH_BY[r];if(t&&t.pl){const i=pIdx(t.pl),st=i>=0&&cres(i);if(st&&st.active){withPlanet(i,()=>refund(st.paid));st.paid={};st.active=null}}else if(active){refund(paid);paid={};active=null}renderTech();break}
    case'queue':queueTech(r);renderTech();break;
    case'unqueue':rq=rq.filter(q=>q!==r);for(let i=1;i<planets.length;i++){const st=cres(i);st.rq=st.rq.filter(q=>q!==r)}renderTech();break;
    case'techtab':techTab=r;sheetEl._h=null;renderTech();break;
    case'clearq':rq=[];renderTech();break;
    case'speed':setSpeed(+b.dataset.n);break;
    case'saveout':saveIO='out';sheetEl.innerHTML=helpHTML();{const ta=$('saveOut');if(ta)ta.select()}break;
    case'savein':saveIO='in';sheetEl.innerHTML=helpHTML();{const ta=$('saveIn');if(ta)ta.focus()}break;
    case'saveclose':saveIO=null;sheetEl.innerHTML=helpHTML();break;
    case'savecopy':{const ta=$('saveOut');if(!ta)break;if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('Save copied'),()=>{ta.select();toast('Press Ctrl+C to copy')});else{ta.select();toast('Press Ctrl+C to copy')}break}
    case'saveload':{const ta=$('saveIn');let ok=false;try{const v=ta.value.trim();if(v.startsWith('FLS2:'))ok=load(decodeURIComponent(escape(atob(v.slice(5)))))}catch(e){ok=false}
      if(ok){saveIO=null;closeAll();clearModes();save();refreshHotbar(true);toast('Factory loaded',true)}else toast('That text is not a valid save.');break}
    case'reset':resetArm=true;sheetEl.innerHTML=helpHTML();break;
    case'resetNo':resetArm=false;sheetEl.innerHTML=helpHTML();break;
    case'resetYes':try{localStorage.removeItem(SAVE_KEY)}catch(e){}newGame();closeAll();clearModes();objDone=0;refreshHotbar(true);toast('New world generated',true);break;
    case'tcopy':setTool('copy');break;
    case'bpuse':setBP(i);renderLib();break;
    case'bpren':bpRename=i;bpDelArm=-1;renderLib();break;
    case'bpren2':finishRename();break;
    case'bpexp':bpExportIdx=i;renderLib();{const ta=$('bpOut');if(ta)ta.select()}break;
    case'bpexpclose':bpExportIdx=-1;renderLib();break;
    case'bpcopy':{const ta=$('bpOut');if(!ta)break;navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>toast('Blueprint text copied'),()=>{ta.select();toast('Press Ctrl+C to copy')});if(!navigator.clipboard){ta.select();toast('Press Ctrl+C to copy')}break}
    case'bpdel':bpDelArm=i;renderLib();break;
    case'bpdel2':blueprints.splice(i,1);saveBP();if(bpSel===i)clearModes();else if(bpSel!==null&&bpSel>i)bpSel--;bpDelArm=-1;renderLib();break;
    case'bpimp':bpImportOpen=true;renderLib();{const ta=$('bpIn');if(ta)ta.focus()}break;
    case'bpimpclose':bpImportOpen=false;renderLib();break;
    case'bpimp2':{const ta=$('bpIn');if(ta&&bpImport(ta.value)){bpImportOpen=false;toast('Blueprint imported');renderLib()}else toast('That text is not a valid blueprint.');break}
  }
}

const mctx=miniEl.getContext('2d');
const MINI_ENT={belt:'#c99a3a',belt2:'#d9564a',belt3:'#4aa0e8',belt4:'#c070f0',miner:'#9aa4b0',miner2:'#bcd4ec',pump:'#7a6a50',furnace:'#c4683f',furnace2:'#7ab4e8',assembler:'#6a84a2',assembler2:'#8a76b2',assembler3:'#5cc0a4',refinery:'#7aa89e',splitter:'#d9a43a',psplit:'#9ad97a',silo:'#e8e8ee',dport:'#6ab8ff',rsilo:'#d0d4dc',forge:'#ff7a2a',ash:'#8a7a6a',cryo:'#8fdcff',icedrill:'#bfe6ff',harvester:'#7ad05a',bioreactor:'#5aa04a',gantry:'#e8c34a',slaunch:'#ffd27a',geo:'#ff7a2a',fusion:'#ff7ad8',filter:'#5bbf7a',chest:'#8a6a40',tunnel:'#7a828a',depot:'#e0b050',uplink:'#6ac8f0',pole:'#c8874a',pole2:'#b9c4ce',substation:'#ffd178',generator:'#e05a3a',wind:'#e8ecef',solar:'#3f6ac0',accumulator:'#5aa9f0',reactor:'#5fd35a'};
function drawMini(){
  const id=mctx.createImageData(W,H),d=id.data;
  const pal=(PTYPES[ptype]&&PTYPES[ptype].pal)||{};const mg=hexRgb(pal.mini||'#242821'),ml=hexRgb(pal.miniLiq||'#24506d'),mr=hexRgb(pal.rock||'#3a3c3e'),mj=[34,92,44];
  for(let i=0;i<W*H;i++){const o=ore[i],tt=terr?terr[i]:0;let c=tt===1?ml:tt===2?mr:tt===3?mj:o?hexRgb(ORE_COL[o].mini):mg;const e=grid[i];if(e)c=e.type==='hub'?[242,169,59]:hexRgb(MINI_ENT[e.type]);d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255}
  mctx.putImageData(id,0,0);
  if(sun<0.9){mctx.fillStyle=`rgba(8,12,34,${(1-sun)*0.45})`;mctx.fillRect(0,0,W,H)}
  mctx.strokeStyle='#ece6d6';mctx.lineWidth=1.5;const vw=cw/zoom/T,vh=ch/zoom/T;mctx.strokeRect(cam.x/T-vw/2,cam.y/T-vh/2,vw,vh);
}
miniEl.addEventListener('pointerdown',ev=>{const r=miniEl.getBoundingClientRect();const mv=e=>{cam.x=(e.clientX-r.left)/r.width*W*T;cam.y=(e.clientY-r.top)/r.height*H*T;drawMini()};mv(ev);
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});

// ================== SAVE / LOAD ==================
function serEnt(e){const o={t:e.type,x:e.x,y:e.y,d:e.dir};if(e.recipe)o.r=e.recipe;if(e.filter)o.f=e.filter;if(e.prio)o.pr=e.prio;if(e.items&&e.items.length)o.i=e.items.map(it=>[it.id,+it.p.toFixed(3)]);
  if(e.out&&e.out.length)o.o=e.out;if(e.inb&&Object.keys(e.inb).length)o.b=e.inb;if(e.rin)o.ri=e.rin;if(e.fq&&e.fq.length)o.fq=e.fq;if(e.energy)o.en=e.energy;if(e.charge)o.ch=e.charge;if(e.prog)o.p=e.prog;if(e.crafting)o.c=1;if(e.buf&&e.buf.length)o.bu=e.buf;if(e.mods&&e.mods.length)o.m=e.mods;if(e.pb)o.pb=e.pb;if(e.tq&&e.tq.length)o.tq=e.tq.map(it=>[it.id,+it.t.toFixed(2)]);
  if(e.ext)o.x2=e.ext;return o}
function loadEnt(o){if(!BUILD[o.t]||!inb(o.x,o.y))return null;let free=true;footprint(o.t,o.x,o.y,(a,b)=>{if(!inb(a,b)||grid[idx(a,b)]||(SZ(o.t)>1&&isBlocked(a,b)))free=false});
  if(!free){if(SZ(o.t)>1)refund(BUILD[o.t].cost);return null}const e=mkEnt(o.t,o.x,o.y,o.d);
  if(o.r)e.recipe=o.r;if(o.f)e.filter=o.f;if(o.pr)e.prio=o.pr;if(o.i)e.items=o.i.map(([id,p])=>({id,p}));if(o.o)e.out=o.o;if(o.b)e.inb=o.b;if(o.ri)e.rin=o.ri;if(o.fq)e.fq=o.fq;if(o.en)e.energy=o.en;if(o.ch)e.charge=o.ch;if(o.p)e.prog=o.p;if(o.c)e.crafting=true;if(o.bu)e.buf=o.bu;if(o.m){e.mods=o.m;calcMods(e)}if(o.pb)e.pb=o.pb;if(o.tq)e._tq=o.tq;
  if(o.x2)e.ext=o.x2;return e}
// Everything about the loaded planet that isn't regenerated from its seed
function serPlanet(p){
  return{type:ptype,fdef:PTYPES[ptype]&&PTYPES[ptype].fdef||undefined,gen:pgen,seed,legacy:legacyPower,inv,delivered,made,cam:p.cam,
    res:planets[loadedP]&&planets[loadedP].res?{active:planets[loadedP].res.active,paid:planets[loadedP].res.paid,rq:planets[loadedP].res.rq}:null,
    ents:ents.filter(e=>e.type!=='hub').map(serEnt),ghosts:[...ghosts.values()].map(g=>({t:g.type,x:g.x,y:g.y,d:g.dir,m:g.m})),extra:planetExtraSave()}
}
function planetExtraSave(){const o={};if(cleared.size)o.cl=[...cleared].map(([i,t])=>[i,+t.toFixed(1)]);if(drones.length)o.dr=drones.map(d=>({...d,t:+d.t.toFixed(2)}));return Object.keys(o).length?o:null}
function planetExtraLoad(x){if(!x)return;if(Array.isArray(x.dr))drones=x.dr.filter(d=>d&&Array.isArray(d.items));if(!Array.isArray(x.cl))return;for(const[i,t]of x.cl){if(terr[i]===3){terr[i]=0;cleared.set(i,t)}}chunkCache.clear()}
function serialize(){
  if(planets[curP])planets[curP].cam={x:cam.x,y:cam.y,z:zoom};
  const ps=planets.map((p,i)=>withPlanet(i,()=>serPlanet(p)));
  return JSON.stringify({v:3,cur:curP,planets:ps,techs:[...techs],techLv,active,paid,playTime,genAuto,won,upSent,rq,goals:[...goalsDone],global:globalExtraSave()});
}
function globalExtraSave(){return{flights:flights.map(f=>({...f,t:+f.t.toFixed(1)})),log:tradeLog.slice(-60),unseen:tradeUnseen,shipped,ark:{stage:ark.stage,req:ark.req,paid:ark.paid,pull:ark.pull,launched:ark.launched},droneTrips,expo,swarm,creative}}
function globalExtraLoad(x){flights=[];tradeLog=[];shipped=0;ark={stage:0,req:0,paid:{},pull:false,launched:false,lastT:-99};arkSeq=null;expo={pts:0,total:0,done:0,offers:[],up:{}};swarm={n:0,sats:0};creative=false;applyExpo();if(x){if(x.expo&&typeof x.expo==='object')expo={pts:x.expo.pts||0,total:x.expo.total||0,done:x.expo.done||0,offers:Array.isArray(x.expo.offers)?x.expo.offers:[],up:x.expo.up||{}};if(x.swarm)swarm={n:x.swarm.n||0,sats:x.swarm.sats||0};creative=!!x.creative;applyExpo()}droneTrips=0;if(!x)return;if(Array.isArray(x.flights))flights=x.flights.filter(f=>f&&f.items&&planets[f.to]);if(Array.isArray(x.log))tradeLog=x.log;tradeUnseen=x.unseen||0;shipped=x.shipped||0;if(x.ark&&typeof x.ark==='object'&&x.ark.stage==null&&x.ark.paid&&planets[0]){const st=planets[0].inv;for(const k in x.ark.paid)st[k]=(st[k]||0)+x.ark.paid[k]}
  if(x.ark&&typeof x.ark==='object'&&x.ark.stage!=null)ark={stage:Math.min(ARK.length,x.ark.stage||0),req:Math.min(2,x.ark.req||0),paid:x.ark.paid||{},pull:!!x.ark.pull,launched:!!x.ark.launched,lastT:-99};droneTrips=x.droneTrips||0}
function load(str){
  let s=JSON.parse(str);if(!s)return false;
  if(s.v===2)s={v:3,cur:0,techs:s.techs,techLv:s.techLv,active:s.active,paid:s.paid,playTime:s.playTime,genAuto:s.genAuto,won:s.won,upSent:s.upSent,rq:s.rq,
    planets:[{type:'home',gen:1,seed:s.seed,legacy:s.poles===true?!!s.legacy:true,inv:s.inv,delivered:s.delivered,made:s.made,cam:s.cam?{x:s.cam.x,y:s.cam.y,z:s.cam.z||1}:null,ents:s.ents||[]}]};
  if(s.v!==3||!Array.isArray(s.planets)||!s.planets.length)return false;
  techs=new Set(s.techs||[]);techLv=s.techLv||{};active=s.active||null;paid=s.paid||{};playTime=s.playTime||0;genAuto=!!s.genAuto;won=!!s.won;upSent=s.upSent||0;launch=null;goalsDone=new Set(Array.isArray(s.goals)?s.goals:[]);goalsInit=false;
  for(const k in techLv)techLv[k]=Math.min(REP_MAX,techLv[k]||0);
  rq=Array.isArray(s.rq)?s.rq.filter(id=>TECH_BY[id]&&!repMaxed(TECH_BY[id])):[];
  planets=[];
  for(const pd of s.planets){if(!PTYPES[pd.type]&&pd.fdef)ensureFrontierType(pd.type,pd.fdef);if(!PTYPES[pd.type])continue;
    const p=makePlanet(pd.type,pd.seed,pd.gen||1);planets.push(p);loadP(p);
    // old shared-grid saves switch to power poles; anything left unconnected shows up in the alerts
    if(pd.legacy)pendingNotice='power';legacyPower=false;powerDirty=true;inv=pd.inv||{};delivered=pd.delivered||{};made=pd.made||{};
    for(const o of pd.ents||[])loadEnt(o);
    retunnel();
    for(const e of ents)if(e._tq){if(e.role==='in'&&e.pair)e.tq=e._tq.map(([id,t])=>({id,t}));else e._tq.forEach(([id])=>addInv(id));delete e._tq}
    for(const g of pd.ghosts||[])if(BUILD[g.t]&&inb(g.x,g.y)&&!grid[idx(g.x,g.y)])ghosts.set(idx(g.x,g.y),{ghost:true,type:g.t,x:g.x,y:g.y,dir:g.d,m:g.m||{}});
    planetExtraLoad(pd.extra);
    if(pd.res&&typeof pd.res==='object')p.res={active:TECH_BY[pd.res.active]?pd.res.active:null,paid:pd.res.paid||{},rq:(pd.res.rq||[]).filter(q=>TECH_BY[q]),bud:0};
    if(pd.cam)p.cam=pd.cam;stashP(p)}
  if(!planets.length)return false;
  globalExtraLoad(s.global);
  // saves from before colonies: a finished launch means Cinder (and any later colony techs) already happened
  for(const id in COLONY_TECH)if(techs.has(id)&&pIdx(COLONY_TECH[id])<0)colonize(COLONY_TECH[id]);
  for(const t in LOCATE)if(pIdx(t)>=0)techs.add(LOCATE[t]);
  curP=Math.max(0,Math.min(planets.length-1,s.cur||0));simP=curP;loadP(planets[curP]);
  const c=planets[curP].cam;cam.x=c.x;cam.y=c.y;zoom=c.z||1;
  return true;
}
function save(){try{localStorage.setItem(SAVE_KEY,serialize())}catch(e){}}
setInterval(save,20000);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);

// ================== BOOT ==================
function start(data){
  makeIcons();loadBP();
  if(data&&Array.isArray(data.bp)&&!blueprints.length)blueprints=data.bp.filter(validBP);
  let loaded=false;
  try{if(data&&data.s)loaded=load(data.s)}catch(e){loaded=false}
  if(!loaded){try{const s=localStorage.getItem(SAVE_KEY);if(s)loaded=load(s)}catch(e){loaded=false}}
  if(!loaded){newGame();openHelp()}
  try{window.claude?.hot?.snapshot(()=>({s:serialize(),bp:blueprints}))}catch(e){}
  buildHotbar();renderObjectives();updateUI();drawMini();updateModebar();renderPBar();
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
